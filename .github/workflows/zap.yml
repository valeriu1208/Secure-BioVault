name: ZAP Active Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write       
  security-events: write 

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Environment & Generate Ed25519 Keys cleanly
      - name: Set Permissions & Generate Keys
        run: |
          rm -rf secrets/ .env
          make key
          chmod 644 secrets/jwt_*.pem
          
      # 2. Build and start stack
      - name: RUN DOCKER COMPOSE
        run: |
          docker compose up --build -d

      # 3. Wait for backend service health check
      - name: Wait for App to be healthy
        run: |
          echo "Waiting for backend service on port 8000..."
          timeout 60 bash -c 'until curl -s -f http://localhost:8000/health; do sleep 2; done'
          echo "App is ready for active scanning!"

      # 4. Authenticate using seeded admin user from init.sql
      - name: Authenticate and get token
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Acquire JWT token from backend auth endpoint
          RESPONSE=$(curl -s -X POST http://localhost:8000/auth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin" \
            -d "password=${ADMIN_PASSWORD}")
          
          # Extract token
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // .token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Failed to acquire auth token! Response from backend: $RESPONSE"
            exit 1
          fi

          echo "DYNAMIC_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 5. Run Authenticated ZAP Scans against Backend API & Frontend
      - name: ZAP DAST Scans (Backend & Frontend)
        env:
          DYNAMIC_TOKEN: ${{ env.DYNAMIC_TOKEN }}
        run: |
          # Create placeholder report files and make them world-writable
          touch backend_report.json backend_report.html frontend_report.json frontend_report.html
          chmod 777 backend_report.json backend_report.html frontend_report.json frontend_report.html

          echo "Starting Backend OpenAPI Scan..."
          docker run --net=host -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json \
            -f openapi \
            -J backend_report.json \
            -r backend_report.html \
            -I \
            -z "-config replacer.full_list\(0\).description=Auth \
               -config replacer.full_list\(0\).enabled=true \
               -config replacer.full_list\(0\).matchtype=req_header \
               -config replacer.full_list\(0\).matchstr=Authorization \
               -config replacer.full_list\(0\).regex=false \
               -config replacer.full_list\(0\).replacement=\"Bearer $DYNAMIC_TOKEN\"" 

          echo "Starting Streamlit Frontend Scan..."
          docker run --net=host -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:8501 \
            -j \
            -J frontend_report.json \
            -r frontend_report.html \
            -I \
            -z "-config replacer.full_list\(0\).description=Auth \
               -config replacer.full_list\(0\).enabled=true \
               -config replacer.full_list\(0\).matchtype=req_header \
               -config replacer.full_list\(0\).matchstr=Authorization \
               -config replacer.full_list\(0\).regex=false \
               -config replacer.full_list\(0\).replacement=\"Bearer $DYNAMIC_TOKEN\""

      # 6. Evaluate all results in one go
      - name: Evaluate ZAP Results (Block on HIGH/CRITICAL)
        run: |
          BACKEND_HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3" or .riskcode == "4")] | length' backend_report.json)
          FRONTEND_HIGH=$(jq '[.site[]? | select(.["@name"] | contains("localhost")) | .alerts[]? | select(.riskcode == "3" or .riskcode == "4")] | length' frontend_report.json)
          # Only count alerts where the site name includes "localhost"
          

          # Default to 0 if jq returns nothing due to an empty array
          BACKEND_HIGH=${BACKEND_HIGH:-0}
          FRONTEND_HIGH=${FRONTEND_HIGH:-0}
          TOTAL_HIGH=$((BACKEND_HIGH + FRONTEND_HIGH))
          
          echo "Backend High/Critical Alerts: $BACKEND_HIGH"
          echo "Frontend High/Critical Alerts: $FRONTEND_HIGH"
          
          if [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "::error::ZAP found $TOTAL_HIGH High/Critical vulnerabilities! Blocking merge."
            exit 1
          else
            echo "ZAP Scans passed: No High vulnerabilities found."
            exit 0
          fi

      # 7. Upload both artifacts
      - name: Upload DAST HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-reports
          path: |
            backend_report.html
            frontend_report.html
