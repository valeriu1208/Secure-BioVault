name: ZAP Active Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule: # 3:00 UTC daily (continuous DAST regression checks)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write       
  security-events: write 

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Environment & Generate Ed25519 Keys cleanly
      - name: Set Permissions & Generate Keys
        run: |
          rm -rf secrets/ .env
          make key
          chmod 644 secrets/jwt_*.pem
          # Throwaway self-signed certificate for the Caddy HTTPS proxy
          # (developers use mkcert locally; ZAP accepts untrusted certificates).
          mkdir -p secrets/tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj /CN=localhost -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout secrets/tls/key.pem -out secrets/tls/cert.pem
          chmod 644 secrets/tls/*.pem
          
      # 2. Build and start stack
      - name: RUN DOCKER COMPOSE
        run: |
          docker compose up --build -d

      # 3. Wait for backend service health check
      - name: Wait for App to be healthy
        run: |
          echo "Waiting for backend service on https://localhost:8443..."
          timeout 60 bash -c 'until curl -k -s -f https://localhost:8443/health; do sleep 2; done'
          echo "App is ready for active scanning!"

      # 4. Authenticate seeded admin user (with mandatory TOTP MFA)
      - name: Authenticate and get token
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Request initial TOTP setup secret
          RESPONSE=$(curl -k -s -X POST https://localhost:8443/auth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "username=admin" \
            -d "password=${ADMIN_PASSWORD}")

          TOTP_SECRET=$(echo "$RESPONSE" | jq -r '.secret // empty')

          # Generate 6-digit TOTP code and complete MFA login
          if [ -n "$TOTP_SECRET" ]; then
            echo "::add-mask::$TOTP_SECRET"
            TOTP_CODE=$(TOTP_SECRET="$TOTP_SECRET" python3 -c 'import base64,hashlib,hmac,os,struct,time; k=base64.b32decode(os.environ["TOTP_SECRET"],casefold=True); h=hmac.new(k,struct.pack(">Q",int(time.time())//30),hashlib.sha1).digest(); o=h[-1]&15; c=(struct.unpack(">I",h[o:o+4])[0]&0x7fffffff)%1000000; print(f"{c:06d}")')

            RESPONSE=$(curl -k -s -X POST https://localhost:8443/auth/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=password" \
              -d "username=admin" \
              -d "password=${ADMIN_PASSWORD}" \
              -d "totp_code=${TOTP_CODE}")
          fi

          # Extract JWT access token
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // .token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Failed to acquire auth token! Response from backend: $RESPONSE"
            exit 1
          fi

          echo "DYNAMIC_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 5. Run Authenticated ZAP Scans against Backend API & Frontend
      - name: ZAP DAST Scans (Backend & Frontend)
        env:
          DYNAMIC_TOKEN: ${{ env.DYNAMIC_TOKEN }}
        run: |
          # Create placeholder report files writable by the ZAP container user
          touch backend_report.json backend_report.html backend_report.xml \
                frontend_report.json frontend_report.html frontend_report.xml
          chmod 666 backend_report.* frontend_report.*

          echo "Starting Backend OpenAPI Scan..."
          docker run --net=host -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t https://localhost:8443/openapi.json \
            -f openapi \
            -J backend_report.json \
            -x backend_report.xml \
            -r backend_report.html \
            -I \
            -z "-config replacer.full_list\(0\).description=Auth \
               -config replacer.full_list\(0\).enabled=true \
               -config replacer.full_list\(0\).matchtype=req_header \
               -config replacer.full_list\(0\).matchstr=Authorization \
               -config replacer.full_list\(0\).regex=false \
               -config replacer.full_list\(0\).replacement=\"Bearer $DYNAMIC_TOKEN\""

          echo "Starting Streamlit Frontend Scan..."
          docker run --net=host -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t https://localhost \
            -j \
            -J frontend_report.json \
            -x frontend_report.xml \
            -r frontend_report.html \
            -I \
            -z "-config replacer.full_list\(0\).description=Auth \
               -config replacer.full_list\(0\).enabled=true \
               -config replacer.full_list\(0\).matchtype=req_header \
               -config replacer.full_list\(0\).matchstr=Authorization \
               -config replacer.full_list\(0\).regex=false \
               -config replacer.full_list\(0\).replacement=\"Bearer $DYNAMIC_TOKEN\""

      # 6. Evaluate all results in one go
      - name: Evaluate ZAP Results (Block on HIGH/CRITICAL)
        run: |
          BACKEND_HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3" or .riskcode == "4")] | length' backend_report.json)
          FRONTEND_HIGH=$(jq '[.site[]? | select(.["@name"] | contains("localhost")) | .alerts[]? | select(.riskcode == "3" or .riskcode == "4")] | length' frontend_report.json)
          # Only count alerts where the site name includes "localhost"
          

          # Default to 0 if jq returns nothing due to an empty array
          BACKEND_HIGH=${BACKEND_HIGH:-0}
          FRONTEND_HIGH=${FRONTEND_HIGH:-0}
          TOTAL_HIGH=$((BACKEND_HIGH + FRONTEND_HIGH))
          
          echo "Backend High/Critical Alerts: $BACKEND_HIGH"
          echo "Frontend High/Critical Alerts: $FRONTEND_HIGH"
          
          if [ "$TOTAL_HIGH" -gt 0 ]; then
            echo "::error::ZAP found $TOTAL_HIGH High/Critical vulnerabilities! Blocking merge."
            exit 1
          else
            echo "ZAP Scans passed: No High vulnerabilities found."
            exit 0
          fi

      # 7. Upload DAST reports (HTML for humans + XML for DefectDojo)
      - name: Upload DAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-reports
          path: |
            backend_report.html
            frontend_report.html
            backend_report.xml
            frontend_report.xml
          retention-days: 7

      # 8. Centralize DAST findings in DefectDojo (when secrets are configured)
      - name: Upload ZAP Reports to DefectDojo
        if: always()
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          bash scripts/upload_to_defectdojo.sh \
            "ZAP Scan" \
            "backend_report.xml" \
            "OWASP ZAP - Backend API"
          bash scripts/upload_to_defectdojo.sh \
            "ZAP Scan" \
            "frontend_report.xml" \
            "OWASP ZAP - Frontend Web"
