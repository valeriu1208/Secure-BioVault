name: ZAP Active Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write       
  security-events: write 

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # 1. Build and start stack
      - name: RUN MAKE
        run: make key
      - name: Set Permissions
        run: |
          rm -rf secrets/ .env
          make key
          chmod 644 secrets/jwt_*.pem
          
      # 2. Build and start your entire stack in the background
      - name: RUN DOCKER COMPOSE
        run: |
          docker compose up --build -d

      - name: Wait for App to be healthy
        run: |
          echo "Waiting for frontend service on port 8501..."
          timeout 60 bash -c 'until curl -s -f http://localhost:8501; do sleep 2; done'
          echo "App is ready for active scanning!"
            # 1. Log in via API and save the token to the GitHub Environment
      - name: Authenticate and get token
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/auth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username="admin" \
            -d "password= $ADMIN_PASSWORD" )
          
          # Extract the token using jq (assuming your app returns {"token": "ey..."})
          TOKEN=$(echo $RESPONSE | jq -r .token)
          
          # Save it so the next step can use it
          echo "DYNAMIC_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 2. Run ZAP using the dynamically generated token
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:8501' 
          cmd_options: '-a -config replacer.full_list(0).description=Auth -config \
            replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=req_header -config \
            replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config \
            replacer.full_list(0).replacement="Bearer ${{ env.DYNAMIC_TOKEN }}"'

   
