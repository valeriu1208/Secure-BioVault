name: ZAP Active Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write       
  security-events: write 

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Environment & Generate Ed25519 Keys cleanly
      - name: Set Permissions & Generate Keys
        run: |
          rm -rf secrets/ .env
          make key
          chmod 644 secrets/jwt_*.pem
          
      # 2. Build and start stack
      - name: RUN DOCKER COMPOSE
        run: |
          docker compose up --build -d

      # 3. Wait for backend service health check
      - name: Wait for App to be healthy
        run: |
          echo "Waiting for backend service on port 8000..."
          timeout 60 bash -c 'until curl -s -f http://localhost:8000/health; do sleep 2; done'
          echo "App is ready for active scanning!"

      # 4. Authenticate using seeded admin user from init.sql
      - name: Authenticate and get token
        env:
          # Match this default password to whatever is defined inside init.sql
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin' }}
        run: |
          # Acquire JWT token from backend auth endpoint
          RESPONSE=$(curl -s -X POST http://localhost:8000/auth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin" \
            -d "password=${ADMIN_PASSWORD}")
          
          # Extract token
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // .token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Failed to acquire auth token! Response from backend: $RESPONSE"
            exit 1
          fi

          # Export token to GITHUB_ENV for OWASP ZAP step
          echo "DYNAMIC_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 5. Run Authenticated ZAP Scan against Backend API
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.13.0
        env:
          DYNAMIC_TOKEN: ${{ env.DYNAMIC_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:8000'
          cmd_options: '-config replacer.full_list(0).description=Auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=req_header -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement="Bearer $DYNAMIC_TOKEN"'
