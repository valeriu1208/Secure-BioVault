name: Trivy Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  python-sca:
    name: Extract & Scan Python Dependencies & Git History
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # Set fetch-depth: 0 to fetch full git history for commit secret scanning
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 1: Install dependencies using isolated venvs to avoid freeze pollution
      - name: Generate Pinned Freeze Files
        run: |
          mkdir -p extracted-deps
          
          # Backend freeze in isolated venv
          python -m venv .venv-backend
          source .venv-backend/bin/activate
          pip install -r backend/requirements.txt || true
          pip freeze > extracted-deps/requirements-backend.txt
          deactivate
          
          # Frontend freeze in isolated venv
          python -m venv .venv-frontend
          source .venv-frontend/bin/activate
          pip install -r frontend/requirements.txt || true
          pip freeze > extracted-deps/requirements-frontend.txt
          deactivate

      # Step 2: Full repository & git history scan (JSON artifact)
      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'repo'              # 'repo' scans filesystem + git commit history
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'json'
          output: 'trivy-fs-results.json'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # Step 3: Save JSON report artifact
      - name: Save JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-json-report
          path: trivy-fs-results.json
          retention-days: 7

      # Step 4: SARIF Report Generation (exit-code 0 ensures SARIF is completely generated and uploaded)
      - name: Generate Trivy SARIF Report
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          scan-type: 'repo'
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # Step 5: Upload SARIF to GitHub Security Tab
      - name: Upload SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'python-sca'

      # Step 6: Security Gate Enforcement (Fails pipeline on HIGH/CRITICAL after SARIF upload)
      - name: Evaluate Security Gate
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'repo'
          scan-ref: '.'
          scanners: 'vuln,secret'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
