name: Trivy Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  python-sca:
    name: Extract & Scan Python Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 1: Install dependencies and export explicit lockfiles
      - name: Generate Pinned Freeze Files
        run: |
          mkdir -p extracted-deps
          
          # Backend freeze
          cd backend
          pip install -r requirements.txt || true
          pip freeze > ../extracted-deps/requirements-backend.txt
          cd ..
          
          # Frontend freeze
          cd frontend
          pip install -r requirements.txt || true
          pip freeze > ../extracted-deps/requirements-frontend.txt
          cd ..

      # Step 2: Generate SARIF report for GitHub Security Tab
      - name: Run Trivy Scan (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      # Step 3: Generate JSON report for downloadable artifact
      - name: Run Trivy Scan (JSON)
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          format: 'json'
          output: 'trivy-fs-results.json'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      # Step 4: Save JSON report as downloadable artifact
      - name: Save JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-json-report
          path: trivy-fs-results.json
          retention-days: 7

      # Step 5: Upload SARIF to GitHub Security Tab
      - name: Upload SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'python-sca'
