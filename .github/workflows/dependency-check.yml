name: Trivy Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  python-sca:
    name: Extract & Scan Python Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 1: Install dependencies and export explicit lockfiles
      - name: Generate Pinned Freeze Files
        run: |
          mkdir -p extracted-deps
          
          # Backend freeze
          cd backend
          pip install -r requirements.txt || true
          pip freeze > ../extracted-deps/requirements-backend.txt
          cd ..
          
          # Frontend freeze
          cd frontend
          pip install -r requirements.txt || true
          pip freeze > ../extracted-deps/requirements-frontend.txt
          cd ..

      # Step 2: Full repository scan (JSON artifact - exit-code 0 so it never fails the step)
      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,config'
          format: 'json'
          output: 'trivy-fs-results.json'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # Step 3: ALWAYS save JSON report as artifact (even if future steps fail)
      - name: Save JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-json-report
          path: trivy-fs-results.json
          retention-days: 7

      # Step 4: Vulnerability Enforcement Step (FAILS build on actionable HIGH/CRITICAL)
      - name: Evaluate Security Policy (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'               # Target vulnerabilities to enforce quality gate
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          exit-code: '1'                 # Fixed: Fails build if actionable HIGH/CRITICAL package vulnerabilities are found
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true           # Ignores unpatchable OS-level CVEs

      # Step 5: Upload SARIF to Security Tab (Runs even if Step 4 fails)
      - name: Upload SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'python-sca'
