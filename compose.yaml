services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?Set FILE_ENCRYPTION_KEY in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY in .env}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      OPA_URL: http://opa:8181
      OIDC_ISSUER: https://localhost:8443
    # Not published on the host: reach it over HTTPS via the proxy (port 8443).
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      opa:
        condition: service_started

  opa:
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    # Not published on the host: reach it over HTTPS via the proxy (port 443).
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets/tls:/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  db-migrate:
    image: postgres:16.4-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/migrations/001_persistent_api.sql:/migrations/001_persistent_api.sql:ro
      - ./database/migrations/002_stateless_access_tokens.sql:/migrations/002_stateless_access_tokens.sql:ro
      - ./database/migrations/003_mfa_columns.sql:/migrations/003_mfa_columns.sql:ro
      - ./database/migrations/004_file_role_permissions.sql:/migrations/004_file_role_permissions.sql:ro
      - ./database/migrations/005_file_deletion_notices.sql:/migrations/005_file_deletion_notices.sql:ro
      - ./database/migrations/006_tamper_proof_audit_logs.sql:/migrations/006_tamper_proof_audit_logs.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /migrations/001_persistent_api.sql
      - -f
      - /migrations/002_stateless_access_tokens.sql
      - -f
      - /migrations/003_mfa_columns.sql
      - -f
      - /migrations/004_file_role_permissions.sql
      - -f
      - /migrations/005_file_deletion_notices.sql
      - -f
      - /migrations/006_tamper_proof_audit_logs.sql

  db:
    image: postgres:16.4-alpine
    container_name: biovault_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
     - postgres_api_data:/var/lib/postgresql/data
     - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_api_data:
