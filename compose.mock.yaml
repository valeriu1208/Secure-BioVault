services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.mock
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16.4-alpine
    container_name: biovault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: biovault_db
      POSTGRES_USER: biovault_user
      POSTGRES_PASSWORD: BioVault2026!
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biovault_user -d biovault_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
